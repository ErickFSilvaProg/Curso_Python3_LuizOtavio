<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Exercício - CSS3</title>
    <!-- CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- FORMULÁRIO -->
    <form action="" method="post">

        <!-- Cabeçalho -->
        <div class="login-close">
            <button type="button">&times;</button>
        </div>
        <div class="login-title">
            Login Form
        </div>

        <!-- Componentes -->
        <div class="componentes-form">
            <div>
                <label for="email">E-mail or Phone</label>
                <input type="email" name="text_email_phone" id="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" name="text_password" id="password">
            </div>
        </div>

        <!-- Rodapé -->
        <div class="rodape-form">
            <a href="index.html">Forgot Password?</a>
            <input type="submit" value="LOGIN">
            <p>
                Not a member? <a href="index.html">Signup Now</a>
            </p>
        </div>
    </form>

</body>

</html>
