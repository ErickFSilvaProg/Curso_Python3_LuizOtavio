<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML Entities & Symbols</title>
    <!-- CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>
            HTML Entities e Symbols
        </h1>
    </header>

    <section>
        <article>
            <h3>
                HTML Entities
            </h3>
            <p>
                São utilizados para substituir caracteres reservados do HTML: <span>&lt;br&gt;</span>,
                <span>&lt;span&gt;</span>...
            </p>
        </article>

        <article>
            <h3>
                HTML Symbols
            </h3>
            <p>
                São determinados símbolos que poderam ser utilizados no conteúdo da página mas que não estam acessíveis
                através do teclado do computador: <span>&copy;</span>, <span>&reg;</span>, <span>&#8592</span>...
            </p>
        </article>
    </section>

</body>

</html>
