<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Atributo target</title>
    <!-- CSS -->
    
</head>

<body>
    
    <div>
        <a href="https://google.com" target="_self">Google (_self)</a>
        <br>
        <a href="http://google.com" target="_blank">Google (_blank)</a>
    </div>
    <br>
    <div>
        <a href="http://google.com" target="_blank" title="Google">
            <img src="../../imagens/google_logo.png" alt="Google">
        </a>
        <br>
        <a href="https://google.com" target="_blank" title="Google">
            <article>
                <h3>
                    Lorem, ipsum.
                </h3>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse ut fugiat iure! Assumenda ducimus molestias optio, harum ullam nobis saepe consequatur veniam totam magnam itaque debitis cupiditate nam nihil enim?
                </p>
            </article>
        </a>
    </div>
    
</body>

</html>
