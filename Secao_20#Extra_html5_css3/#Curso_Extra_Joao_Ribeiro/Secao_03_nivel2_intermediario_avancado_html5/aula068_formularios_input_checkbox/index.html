<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulários</title>
    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- CSS -->
    <style>
        .form-container {
            margin: auto;
            width: 60%;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="form-container">
            <h3>
                Formulário - Checkbox
            </h3>

            <form action="https://sys4soft.com/udemy/forms/index.php" method="post">

                <div class="form-group">
                    <label>
                        <input type="checkbox" name="check-atualizar" value="atualizar">
                        Atualizar os dados automaticamente.
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" name="campo-salvar" value="salvar">
                        Salvar toda a informação automaticamente.
                    </label>
                </div>

                <div class="form-group">
                    <input type="submit" value="Enviar">
                </div>

            </form>
        </div>

    </div>
</body>

</html>
