<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulários</title>
    <!-- CSS -->
    <style>
        .form-container {
            margin: auto;
            width: 60%;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form action="https://sys4soft.com/udemy/forms/index.php" method="post">
            <h3>
                O elemento label
            </h3>

            <div class="form-group">
                <label for="campo-usuario">Usuário: </label>
                <input type="text" name="campo-usuario" id="campo-usuario" required>
            </div>

            <div class="form-group">
                <label for="campo-senha">Senha: </label>
                <input type="password" name="campo-senha" id="campo-senha" required>
            </div>

            <div class="form-group">
                <input type="submit" value="Enviar">
            </div>
        </form>
    </div>

</body>

</html>
